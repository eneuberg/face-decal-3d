<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Face Decal Tool</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <aside id="panel">
        <h1>FACE&nbsp;DECAL&nbsp;TOOL</h1>

        <section class="step" data-step="1">
          <div class="step-num">01</div>
          <div class="step-body">
            <h2>Load Model</h2>
            <label class="file-input">
              <span>Choose .glb / .gltf</span>
              <input type="file" id="model-input" accept=".glb,.gltf" />
            </label>
          </div>
        </section>

        <section class="step" data-step="2">
          <div class="step-num">02</div>
          <div class="step-body">
            <h2>Upload Decal Image</h2>
            <label class="file-input">
              <span>Choose .png / .jpg / .webp</span>
              <input type="file" id="image-input" accept=".png,.jpg,.jpeg,.webp" />
            </label>
          </div>
        </section>

        <section class="step" data-step="3">
          <div class="step-num">03</div>
          <div class="step-body">
            <h2>Crop</h2>
            <p class="hint">Crop overlay opens after upload.</p>
          </div>
        </section>

        <section class="step" data-step="4">
          <div class="step-num">04</div>
          <div class="step-body">
            <h2>Place Decal</h2>
            <p class="hint">Click on the model to project. Click again to move.</p>
            <p class="hint">Hold <kbd>Shift</kbd> + scroll to resize.</p>
            <div class="size-row">
              <label for="size-slider">Size</label>
              <input
                type="range"
                id="size-slider"
                min="0.01"
                max="1.0"
                step="0.01"
                value="0.15"
              />
              <span id="size-value">0.15</span>
            </div>
            <button id="redo-projection" disabled>Redo Projection</button>
          </div>
        </section>

        <section class="step" data-step="5">
          <div class="step-num">05</div>
          <div class="step-body">
            <h2>Save</h2>
            <button id="save-btn" disabled>Save GLB</button>
          </div>
        </section>

        <div id="status" role="status" aria-live="polite"></div>
      </aside>

      <main id="viewport"></main>
    </div>

    <div id="crop-modal" class="hidden" aria-hidden="true">
      <div class="crop-container">
        <div class="crop-toolbar">
          <button id="crop-mode-rect" class="mode active">Rectangle</button>
          <button id="crop-mode-lasso" class="mode">Lasso</button>
          <span class="crop-hint" id="crop-hint">Drag corners to resize, drag inside to move.</span>
        </div>
        <div class="crop-stage">
          <canvas id="crop-canvas"></canvas>
        </div>
        <div class="crop-actions">
          <button id="crop-cancel">Cancel</button>
          <button id="crop-confirm" class="primary">Confirm Crop</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
